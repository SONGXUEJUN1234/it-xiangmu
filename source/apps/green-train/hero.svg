<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16241d"/>
      <stop offset="0.55" stop-color="#22382d"/>
      <stop offset="1" stop-color="#0e1a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8934a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8934a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e8934a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2e25" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b130f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <!-- 远处站台灯 -->
  <circle cx="320" cy="330" r="5" fill="#f4c98a" opacity="0.85"/>
  <circle cx="1180" cy="300" r="4" fill="#f4c98a" opacity="0.6"/>
  <circle cx="1360" cy="380" r="3" fill="#f4c98a" opacity="0.45"/>
  <!-- 窗外雨丝般的细线 -->
  <g stroke="#8fae9d" stroke-opacity="0.12" stroke-width="2">
    <line x1="180" y1="120" x2="150" y2="520"/>
    <line x1="520" y1="90" x2="480" y2="480"/>
    <line x1="980" y1="140" x2="940" y2="560"/>
    <line x1="1320" y1="100" x2="1290" y2="500"/>
  </g>
  <!-- 站台光晕 -->
  <ellipse cx="800" cy="620" rx="700" ry="180" fill="url(#glow)"/>
  <!-- 铁轨 -->
  <g stroke="#3a5546" stroke-width="3" opacity="0.8">
    <line x1="0" y1="760" x2="1600" y2="700"/>
    <line x1="0" y1="820" x2="1600" y2="745"/>
  </g>
  <g stroke="#57785f" stroke-width="4" opacity="0.55">
    <line x1="120" y1="760" x2="80" y2="900"/>
    <line x1="460" y1="750" x2="430" y2="900"/>
    <line x1="800" y1="738" x2="790" y2="900"/>
    <line x1="1140" y1="726" x2="1150" y2="900"/>
    <line x1="1480" y1="715" x2="1510" y2="900"/>
  </g>
  <!-- 车窗内沿（底部座椅暗影） -->
  <path d="M0 780 Q400 760 800 790 T1600 780 L1600 900 L0 900 Z" fill="url(#seat)"/>
  <!-- 信号橙圆点 -->
  <circle cx="1490" cy="120" r="10" fill="#e8632c" opacity="0.9"/>
  <circle cx="1490" cy="120" r="22" fill="none" stroke="#e8632c" stroke-opacity="0.35" stroke-width="3"/>
</svg>
