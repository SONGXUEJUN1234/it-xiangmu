<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茅盾文学奖网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #8B1A1A 0%, #6B1212 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #8B1A1A; margin-bottom: 20px; }
    .description { color: #666; line-height: 1.8; margin-bottom: 30px; }
    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .tech-tag {
      background: #F5F1E8;
      color: #8B1A1A;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #C9A961 0%, #B8944D 100%);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 169, 97, 0.4);
    }
    .preview {
      margin-top: 30px;
      padding: 20px;
      background: #F5F1E8;
      border-radius: 12px;
    }
    .preview-title {
      color: #8B1A1A;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .card-demo {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .demo-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .demo-cover {
      background: linear-gradient(135deg, #8B1A1A, #C9A961);
      height: 50px;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }
    .demo-title { font-size: 12px; color: #8B1A1A; font-weight: bold; }
    .demo-author { font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 茅盾文学奖网站</h1>
    <p class="description">
      展示历年茅盾文学奖获奖作品与作家介绍的静态网站。
      采用现代卡片式设计，深红+金色配色方案。
    </p>
    <div class="tech-stack">
      <span class="tech-tag">Hugo</span>
      <span class="tech-tag">CSS3</span>
      <span class="tech-tag">YAML</span>
      <span class="tech-tag">Vercel</span>
    </div>
    <a href="https://maodun-award.vercel.app" target="_blank" class="btn">
      访问网站 →
    </a>
    <div class="preview">
      <div class="preview-title">网站预览</div>
      <div class="card-demo">
        <div class="demo-card">
          <div class="demo-cover">雪</div>
          <div class="demo-title">雪山大地</div>
          <div class="demo-author">杨志军</div>
        </div>
        <div class="demo-card">
          <div class="demo-cover">宝</div>
          <div class="demo-title">宝水</div>
          <div class="demo-author">乔叶</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
