# Docker Compose - 开发环境
# 用于本地开发，启动 PostgreSQL 和 Redis

version: "3.8"

services:
  # ============================================
  # PostgreSQL 数据库
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban_password
      POSTGRES_DB: kanban_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kanban-network

  # ============================================
  # Redis (用于 Socket.IO 和缓存)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: kanban-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kanban-network

  # ============================================
  # pgAdmin (可选 - 数据库管理工具)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kanban-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kanban.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - kanban-network
    profiles:
      - tools

  # ============================================
  # Redis Commander (可选 - Redis 管理工具)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: kanban-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - kanban-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  kanban-network:
    driver: bridge
